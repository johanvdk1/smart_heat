request:
  fields:
    zone:
      required: true
      example: woonkamer
      selector:
        text:
    temperature:
      required: true
      example: 21
      selector:
        number:
          min: 5
          max: 23
          step: 0.5
          unit_of_measurement: "°C"
    ready_at:
      required: true
      example: "19:00"
      selector:
        text:
cancel_request:
  fields:
    zone:
      required: true
      example: woonkamer
      selector:
        text:
